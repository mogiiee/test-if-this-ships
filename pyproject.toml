[project]
name = "groundskeeper"
version = "0.1.0"
description = "Sparse, consequence-first GitHub PR reviewer for appointment bridges"
requires-python = ">=3.14"
dependencies = [
  "anthropic>=0.64.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "PyJWT[crypto]>=2.10.0",
  "python-dotenv>=1.1.0",
  "uvicorn[standard]>=0.35.0",
]

[project.scripts]
groundskeeper = "groundskeeper.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundskeeper"]

[tool.uv]
dev-dependencies = []
