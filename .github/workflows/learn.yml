name: Save learned note

# App contents is read-only. User-repo branch protection blocks GITHUB_TOKEN
# from pushing main, so this opens a PR and admin-merges.

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  save:
    if: ${{ github.event.comment.user.login == 'if-this-ships[bot]' && contains(github.event.comment.body, '<!-- if-this-ships-learn') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Append note
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python scripts/apply_learn.py
      - name: Commit, PR, merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "if-this-ships[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add context/learned.md
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          BRANCH="learn/${GITHUB_RUN_ID}"
          git checkout -B "$BRANCH"
          git commit -m "teach: save learned note"
          git push origin "$BRANCH"
          url=$(gh pr create --base main --head "$BRANCH" --title "teach: save learned note" --body "Taught note from a review comment.")
          gh pr merge "$url" --merge --admin --delete-branch
