name: Save learned note

# Bot cannot write the repo (GitHub App contents=read). This job can.
# Push to main then also triggers Deploy to ECS.

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write

jobs:
  save:
    if: ${{ github.event.comment.user.login == 'if-this-ships[bot]' && contains(github.event.comment.body, '<!-- if-this-ships-learn') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Append note
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python scripts/apply_learn.py
      - name: Commit to main
        run: |
          git config user.name "if-this-ships[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add context/learned.md
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "teach: save learned note"
          git push origin HEAD:main
