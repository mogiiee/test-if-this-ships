name: Deploy to DEV3

# Push to main → GitHub OIDC → ECR in appointment DEV3 → App Runner.
# No static AWS keys. Role is locked to this workflow on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "183631321235"
  AWS_ROLE_ARN: arn:aws:iam::183631321235:role/if-this-ships-github
  ECR_REPOSITORY: if-this-ships
  APPRUNNER_SERVICE: if-this-ships

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          docker build --platform linux/amd64 --build-arg GIT_SHA="${SHA}" \
            -t "${IMAGE}:${SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy App Runner
        run: |
          ARN=$(aws apprunner list-services --region "$AWS_REGION" \
            --query "ServiceSummaryList[?ServiceName=='${APPRUNNER_SERVICE}'].ServiceArn" \
            --output text)
          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "App Runner service not created yet. Image is in ECR. Set if_this_ships_has_image=true and apply terraform."
            exit 0
          fi
          aws apprunner start-deployment --service-arn "$ARN" --region "$AWS_REGION"
          for i in $(seq 1 40); do
            STATUS=$(aws apprunner describe-service --service-arn "$ARN" --region "$AWS_REGION" \
              --query "Service.Status" --output text)
            echo "status=$STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              exit 0
            fi
            if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
              echo "App Runner failed: $STATUS"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for App Runner"
          exit 1
